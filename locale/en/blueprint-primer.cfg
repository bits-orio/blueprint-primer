[item-name]
bp-primer-tool=Primer tool

[item-description]
bp-primer-tool=Click or drag over one machine, ghost or built, to request exact amounts of its ingredients and fuel. Construction robots deliver them.

[shortcut-name]
bp-primer-shortcut=Primer tool

[shortcut-description]
bp-primer-shortcut=Request exact amounts of ingredients and fuel for one machine.

[controls]
bp-primer-prime=Prime the machine under the cursor

[controls-description]
bp-primer-prime=Opens the priming window for the machine under the cursor. With nothing primable under the cursor, it hands you the primer tool, or puts it away if you already hold it.

