[item-name]
bp-primer-tool=Primer tool

[item-description]
bp-primer-tool=Click or drag over a machine or chest, ghost or built, to request exact amounts of its ingredients, fuel or items. Construction robots deliver them.

[shortcut-name]
bp-primer-shortcut=Primer tool

[shortcut-description]
bp-primer-shortcut=Request exact amounts of ingredients and fuel for a machine, or of items for a chest.

[controls]
bp-primer-prime=Prime the machine or chest under the cursor

[controls-description]
bp-primer-prime=Opens the priming window for the machine or chest under the cursor. With nothing primable under the cursor, it hands you the primer tool, or puts it away if you already hold it.

